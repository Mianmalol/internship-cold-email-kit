name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    env:
      # Tests must not depend on any real secret; make sure none leaks in from CI.
      OUTREACH_GMAIL_APP_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Non-editable install
        run: pip install .
      - name: Console scripts + setup scaffold (no source checkout)
        run: |
          cd "$(mktemp -d)"
          OUTREACH_SECRET_BACKEND=env outreach setup
          test -f config.toml
          outreach-send --help >/dev/null
